# Type-check configuration. Dev tooling only; not required to run any script.
# Deliberately non-strict: signatures in this repo already carry hints, and the
# failure mode worth catching is Optional misuse (get_paper -> dict | None), not
# missing annotations.
[mypy]
# Mypy 2.x targets 3.10+; CI executes the runtime on Python 3.10 to 3.13.
python_version = 3.10
ignore_missing_imports = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
